name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Montar projeto
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon-only.png
          npm init -y
          npm i @capacitor/core@7 @capacitor/android@7 @capacitor/browser@7 @capacitor/cli@7 @capacitor/assets@3
          npx cap init "Ficha de Treino" com.fichatreino.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor "#171e2b" --iconBackgroundColorDark "#171e2b"
          npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ficha-treino-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
